name: check

# Public fixtures run without private project data. Linux uses the same
# explicit FLINT 3 / GCC 14 environment used in the local audit.

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mimalloc: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-linux.yml
          cache-environment: true
      - name: Set up SparseRREF (pinned commit + patches)
        run: ./scripts/setup-sparserref.sh
      - name: Build and public exact, cache, parser and template checks
        shell: bash -el {0}
        run: |
          allocator_lib=""
          if [ "${{ matrix.mimalloc }}" = "1" ]; then allocator_lib="-lmimalloc"; fi
          make -j2 check-public PORTABLE=1 MIMALLOC=${{ matrix.mimalloc }} \
            CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++" \
            CXXFLAGS="-O2 -std=c++20 -I. -I$CONDA_PREFIX/include" \
            LDLIBS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -lflint -lgmp -ltbb $allocator_lib"
      - name: WXF memory diagnostics
        if: matrix.mimalloc == 0
        shell: bash -el {0}
        run: |
          make check-wxf-sanitized MIMALLOC=0 \
            CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++" \
            CXXFLAGS="-std=c++20 -I. -I$CONDA_PREFIX/include" \
            LDLIBS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -lflint -lgmp -ltbb"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web bundle
        working-directory: front-end/web
        run: |
          npm ci
          npx vite build

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: API and execution regressions
        run: python -m pytest tests/test_robustness.py tests/test_export_runtime.py -q
